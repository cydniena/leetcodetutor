services:
  db:
    image: postgres:16
    container_name: leetcodetutor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: leetcodetutor
    ports:
      # Loopback only: 5433 on this machine, not on the local network.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d leetcodetutor"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
