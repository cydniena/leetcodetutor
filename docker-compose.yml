services:
  db:
    image: postgres:16
    container_name: leetcodetutor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tutor
      POSTGRES_PASSWORD: tutor
      POSTGRES_DB: leetcodetutor
    ports:
      - "5433:5432"          # 5433 on the host, so a local Postgres on 5432 still works
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d leetcodetutor"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
